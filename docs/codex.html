<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Fantasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2eee7; --surface:#fffdf9; --surface2:#f7f3ec; --line:#ddd5c6;
  --text:#221d28; --muted:#6b6275; --accent:#8a6a1f; --accent2:#2f7d70;
  --accent-soft:rgba(138,106,31,.13); --warn:#a8442c; --warn-soft:rgba(168,68,44,.12); --ok:#2f7d70;
  --shadow:0 1px 2px rgba(40,30,20,.07), 0 10px 26px rgba(40,30,20,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0c13; --surface:#161320; --surface2:#1d1929; --line:#2e2740;
    --text:#ece6f2; --muted:#9a90ad; --accent:#cfa73f; --accent2:#5cb5a3;
    --accent-soft:rgba(207,167,63,.15); --warn:#d8795a; --warn-soft:rgba(216,121,90,.14); --ok:#5cb5a3;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0e0c13; --surface:#161320; --surface2:#1d1929; --line:#2e2740;
  --text:#ece6f2; --muted:#9a90ad; --accent:#cfa73f; --accent2:#5cb5a3;
  --accent-soft:rgba(207,167,63,.15); --warn:#d8795a; --warn-soft:rgba(216,121,90,.14); --ok:#5cb5a3;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Be Vietnam Pro",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Spectral,Georgia,serif;font-weight:600;margin:0}
button,input,select,textarea{font:inherit;color:inherit}

/* topbar */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-family:Spectral,serif;font-size:17px;font-weight:600;letter-spacing:.3px;margin-right:6px}
.logo small{display:block;font-family:"Be Vietnam Pro",sans-serif;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:0}
.tb{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--muted)}
.tb:hover{color:var(--text);border-color:var(--accent)}
.searchbtn{flex:1;max-width:340px;text-align:left;color:var(--muted)}
.erapick{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;max-width:190px}
.flag{font-size:12px;color:var(--muted);min-width:56px;text-align:right}

/* shell */
.app{display:grid;grid-template-columns:210px 1fr}
.side{border-right:1px solid var(--line);background:var(--surface);position:sticky;top:51px;height:calc(100vh - 51px);overflow:auto;padding:10px 8px 40px}
.sgroup{font-size:10.5px;letter-spacing:.9px;color:var(--muted);padding:12px 10px 5px;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--muted);font-size:13.5px;text-align:left}
.nav:hover{background:var(--surface2);color:var(--text)}
.nav[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .ic{width:17px;text-align:center;flex:none}
.nav .ct{margin-left:auto;font-size:11px;opacity:.65}
main{padding:20px 20px 90px;max-width:1180px}
@media (max-width:840px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .sgroup{display:none}
  .nav{width:auto;white-space:nowrap}
  .nav .ct{display:none}
  main{padding:16px 12px 80px}
}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}
.pad{padding:15px 17px}
.phead{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.phead h2{font-size:15.5px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .tiny{font-size:12.5px}
.sec{font-family:Spectral,serif;font-size:15px;font-weight:600;margin:0 0 8px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pagehead h1{font-size:26px;letter-spacing:.3px}
.pagehead p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.btn{background:var(--accent);color:#1a1509;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13.5px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.danger{background:none;color:var(--warn);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.inp,.field input,.field select,.field textarea{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);width:100%}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field textarea{resize:vertical;min-height:76px;line-height:1.6}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;background:var(--surface)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
@media (max-width:700px){.g2,.g3{grid-template-columns:1fr}}
.empty{padding:36px 18px;text-align:center;color:var(--muted);font-size:13.5px}

/* entity cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:11px}
.ecard{position:relative;border:1px solid var(--line);border-radius:11px;background:var(--surface);cursor:pointer;text-align:left;padding:0;color:inherit;overflow:hidden}
.ecard:hover{border-color:var(--accent)}
.ecard .top4{height:4px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.ecard .in{padding:11px 13px 13px;display:flex;gap:10px}
.ecard h3{font-size:15px;line-height:1.25}
.ecard .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.ava{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:10.5px;padding:2px 7px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);font-size:12.5px;cursor:pointer}
.chip.on{border-color:transparent;color:#120e06;font-weight:600}
.chip.st{cursor:default}
.gem{width:9px;height:9px;border-radius:3px;transform:rotate(45deg);flex:none}

/* list rail */
.split{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.ilist{max-height:66vh;overflow:auto;padding:6px}
.item{display:flex;gap:9px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 9px;cursor:pointer;color:inherit}
.item:hover{background:var(--surface2)}
.item[aria-current="true"]{background:var(--accent-soft)}
.item .nm{font-weight:500;line-height:1.25;font-size:13.5px}
.item .mt{font-size:11px;color:var(--muted)}

/* hits */
.hit{display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:8px 11px;margin-bottom:6px;cursor:pointer;color:inherit}
.hit:hover{border-color:var(--accent)}
.hit .w{font-size:11.5px;color:var(--accent);font-weight:600}
.hit .s{font-family:Spectral,serif;font-size:13px;color:var(--muted);margin-top:2px}
.hit .s b{color:var(--text)}
.warn{border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 11px;margin-bottom:6px;font-size:13px}

/* skill card */
.scard{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface);cursor:pointer;text-align:left;padding:0;color:inherit}
.scard:hover{border-color:var(--accent)}
.scard .crown{height:40px;position:relative;display:flex;align-items:center;padding:0 11px;gap:8px}
.scard .crown::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,var(--c1),var(--c2));opacity:.92}
.scard .crown>*{position:relative;z-index:1;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.scard .kd{font-size:11px}
.scard .rk{margin-left:auto;font-family:Spectral,serif;font-weight:600;font-size:14px}
.scard .bd{padding:9px 11px 11px}
.scard .bd h3{font-size:14.5px;line-height:1.3}
.scard .bd p{margin:3px 0 0;font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.folders{display:flex;flex-direction:column;gap:2px}
.fbtn{display:flex;width:100%;background:none;border:0;border-radius:7px;padding:6px 9px;cursor:pointer;color:var(--muted);font-size:12.5px;text-align:left;gap:6px}
.fbtn:hover{background:var(--surface2);color:var(--text)}
.fbtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.fbtn .n{margin-left:auto;opacity:.6;font-size:11px}

/* fusion */
.fuse{display:grid;grid-template-columns:1fr 26px 1fr 26px 1fr;gap:8px;align-items:center}
@media (max-width:820px){.fuse{grid-template-columns:1fr}.op{text-align:center}}
.slot{border:1px dashed var(--line);border-radius:11px;min-height:96px;padding:10px;display:flex;flex-direction:column;justify-content:center;gap:3px;background:var(--surface2)}
.slot.f{border-style:solid;background:var(--surface)}
.op{text-align:center;font-size:18px;color:var(--muted)}

/* writer / reader */
.writer{display:grid;grid-template-columns:1fr 290px;gap:14px;align-items:start}
@media (max-width:1000px){.writer{grid-template-columns:1fr}}
.editor{width:100%;min-height:56vh;border:1px solid var(--line);border-radius:11px;padding:18px 20px;background:var(--surface);font-family:Spectral,Georgia,serif;font-size:17px;line-height:1.85;resize:vertical}
.editor:focus{outline:2px solid var(--accent);outline-offset:1px}
.tin{width:100%;border:0;border-bottom:1px solid var(--line);background:none;font-family:Spectral,serif;font-size:22px;font-weight:600;padding:3px 0 7px}
.tin:focus{outline:none;border-bottom-color:var(--accent)}
.reader{max-width:66ch;margin:0 auto;font-family:Spectral,Georgia,serif;font-size:18px;line-height:1.9}
.reader p{margin:0 0 1.1em}
.mk{border-bottom:2px solid var(--mc,var(--accent));cursor:pointer;border-radius:3px;padding:0 1px}
.mk:hover{background:var(--accent-soft)}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--surface)}
.kpi b{font-family:Spectral,serif;font-size:26px;font-weight:600;display:block;line-height:1.1}
.kpi span{font-size:11.5px;color:var(--muted)}
.bar{height:15px;border-radius:5px;background:var(--accent);min-width:3px}
.brow{display:grid;grid-template-columns:104px 1fr 34px;gap:8px;align-items:center;margin-bottom:5px;font-size:12.5px}

/* matrix */
.mx{border-collapse:collapse;font-size:11.5px}
.mx th,.mx td{border:1px solid var(--line);padding:0}
.mx th{padding:4px 6px;font-weight:500;color:var(--muted);white-space:nowrap;background:var(--surface2)}
.mx td button{width:32px;height:28px;background:none;border:0;cursor:pointer;color:var(--muted)}
.mx td button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.mx td.sf{background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 4px,transparent 4px,transparent 8px)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(8,6,12,.6);display:grid;place-items:start center;z-index:70;padding:40px 16px 16px;overflow:auto}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:13px;max-width:600px;width:100%;box-shadow:var(--shadow)}
.sheet.wide{max-width:820px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;background:var(--text);color:var(--bg);padding:8px 15px;border-radius:99px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

let idxCache=null;
const isW=c=>c?/[\p{L}\p{N}_]/u.test(c):false;
function targets(){
  const t=[];
  allTypes().forEach(ty=>{
    (S.ent[ty.k]||[]).forEach(e=>{
      const ns=[e.name,...String(e.aliases||"").split(",")].map(s=>s.trim()).filter(s=>s.length>1);
      [...new Set(ns)].forEach(n=>t.push({tk:ty.k,id:e.id,text:n,color:ecols(e.els)[0]}));
    });
  });
  return t.sort((a,b)=>b.text.length-a.text.length);
}
function findAll(p,term){
  const out=[],lp=p.toLowerCase(),lt=term.toLowerCase();
  let i=lp.indexOf(lt);
  while(i!==-1){ if(!isW(p[i-1])&&!isW(p[i+lt.length])) out.push(i); i=lp.indexOf(lt,i+1); }
  return out;
}
function index(){
  if(idxCache&&!dirty) return idxCache;
  const tg=targets(), by={}, ch={};
  S.chapters.forEach((c,ci)=>{
    const ps=(c.content||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
    ch[c.id]={paras:ps,marks:[]};
    ps.forEach((p,pi)=>{
      const taken=[];
      tg.forEach(t=>{
        findAll(p,t.text).forEach(pos=>{
          const end=pos+t.text.length;
          if(taken.some(([a,b])=>pos<b&&end>a)) return;
          taken.push([pos,end]);
          const key=t.tk+":"+t.id;
          (by[key]=by[key]||[]).push({cid:c.id,ci,title:c.title||("Chương "+(ci+1)),para:pi,
            snip:p.slice(Math.max(0,pos-46),Math.min(p.length,end+46)),
            off:pos-Math.max(0,pos-46),len:t.text.length});
          ch[c.id].marks.push({para:pi,pos,end,tk:t.tk,id:t.id,color:t.color});
        });
      });
    });
  });
  idxCache={by,ch}; dirty=false; return idxCache;
}
function hits(tk,id){
  const h=index().by[tk+":"+id]||[];
  if(!h.length) return '<p class="tiny muted" style="margin:0">Chưa xuất hiện trong chương nào. Viết tên này vào một chương, hệ thống tự tìm ra.</p>';
  let o='<p class="tiny muted" style="margin:0 0 7px">'+h.length+' lần · '+new Set(h.map(x=>x.cid)).size+' chương</p>';
  h.slice(0,60).forEach(x=>{
    const s=x.snip;
    o+='<button class="hit" onclick="A.jump(\''+x.cid+'\','+x.para+')"><span class="w">Chương '+(x.ci+1)+' · '+esc(x.title)+' · đoạn '+(x.para+1)+'</span>'
      +'<div class="s">…'+esc(s.slice(0,x.off))+'<b>'+esc(s.substr(x.off,x.len))+'</b>'+esc(s.slice(x.off+x.len))+'…</div></button>';
  });
  return o;
}

function skillOf(id){ return byId(S.ent.skill,id); }
function vFuse(){
  const a=fuse[0]?skillOf(fuse[0]):null, b=fuse[1]?skillOf(fuse[1]):null;
  const slot=(s,i)=>s?'<div class="slot f" style="border-color:'+ecols(s.els)[0]+'"><strong style="font-family:Spectral,serif">'+esc(s.name)+'</strong>'
      +'<span class="tiny muted">'+esc((s.f||{}).type||"")+' · '+esc((s.f||{}).mech||"")+' · bậc '+esc((s.f||{}).rank||"—")+'</span>'

    :'<div class="slot"><button class="btn ghost" onclick="A.fpick('+i+')">Chọn skill '+(i+1)+'</button></div>';
  let out='<p class="tiny muted">Chọn đủ hai skill để xem gợi ý.</p>';
  if(a&&b){ const r=mix(a,b);
    out='<div class="panel pad" style="border-color:var(--accent);background:var(--accent-soft)">'
      +'<div class="row" style="justify-content:space-between;align-items:flex-start"><div><h3 style="font-size:18px">'+esc(r.name)+'</h3>'
      +'<p class="tiny" style="margin:4px 0 0;max-width:58ch">'+esc(r.desc)+'</p></div>'
      +'<span style="font-family:Spectral,serif;font-size:21px;font-weight:600">'+esc(r.rank)+'</span></div>'
      +'<div class="chips" style="margin-top:9px">'+r.els.map(id=>'<span class="chip st" style="background:'+elc(id)+';color:#fff;border-color:transparent">'+esc(eln(id))+'</span>').join("")
      +'<span class="chip st">'+esc(r.type)+'</span><span class="chip st">'+esc(r.range)+'</span><span class="chip st">'+esc(r.mech)+'</span></div>'
      +'<div class="row" style="margin-top:11px"><button class="btn" onclick="A.fsave()">Lưu thành skill mới</button></div></div>';
  }
  const fs=allOf("skill").filter(s=>s.recipe);
  return '<div class="pagehead"><div><h1>Phòng hợp thành</h1><p>Ghép hai skill để sinh skill mới</p></div></div>'
   +'<div class="stack"><div class="panel pad"><div class="fuse">'+slot(a,0)+'<div class="op">+</div>'+slot(b,1)+'<div class="op">=</div>'
   +(a&&b?'<div class="slot f" style="border-color:var(--accent)"><strong style="font-family:Spectral,serif">'+esc(mix(a,b).name)+'</strong><span class="tiny muted">chưa lưu</span></div>'
        :'<div class="slot"><span class="tiny muted" style="text-align:center">kết quả</span></div>')
   +'</div><div style="margin-top:12px">'+out+'</div></div>'
   +'<div class="panel"><div class="phead"><h2>Đã hợp thành ('+fs.length+')</h2></div><div class="pad">'
   +(fs.length?'<div class="cards">'+fs.map(s=>skCard(s)).join("")+'</div>':'<p class="tiny muted" style="margin:0">Chưa có.</p>')+'</div></div></div>';
}
function skCard(s){ const c=ecols(s.els); const f=s.f||{};
  return '<button class="scard" style="--c1:'+c[0]+';--c2:'+c[1]+'" onclick="A.go(\'skill\',\''+s.id+'\')">'
  +'<div class="crown"><span class="kd">'+esc(f.type||"")+'</span><span class="rk">'+esc(f.rank||"")+'</span></div>'
  +'<div class="bd"><h3>'+esc(s.name)+'</h3><p>'+esc(f.desc||"")+'</p></div></button>';
}
function mix(a,b){
  const els=[...new Set([...(a.els||[]),...(b.els||[])])];
  const R=S.world.ranks||["E","D","C","B","A","S"];
  const hi=Math.max(R.indexOf((a.f||{}).rank),R.indexOf((b.f||{}).rank));
  const rank=R[Math.min(R.length-1,(hi<0?0:hi)+1)]||"A";
  const heavy=["Tuyệt kỹ","Lãnh vực","Biến hình","Triệu hồi","Cấm thuật"];
  const type=heavy.includes((a.f||{}).type)?a.f.type:heavy.includes((b.f||{}).type)?b.f.type:(a.f||{}).type||"Chủ động";
  const sc=["Toàn bản đồ","Diện rộng","Vùng","Toàn đội","Đồng minh","Đơn mục tiêu","Bản thân"];
  const range=sc.indexOf((a.f||{}).range)<=sc.indexOf((b.f||{}).range)?(a.f||{}).range:(b.f||{}).range;
  const h=(a.name||"").split(" ").slice(0,2).join(" "), t=(b.name||"").split(" ").slice(-2).join(" ");
  return {name:h+" "+t+(els.length?" — "+els.map(eln).join(" · "):""),
    desc:((a.f||{}).desc||"")+" Kết hợp với: "+((b.f||{}).desc||"").replace(/^./,c=>c.toLowerCase()),
    els,type,range:range||"Đơn mục tiêu",rank,
    mech:[(a.f||{}).mech,(b.f||{}).mech].filter(Boolean).join(" + "),recipe:[a.id,b.id]};
}

function detected(ch){
  const m=(index().ch[ch.id]||{marks:[]}).marks, by={};

function check(){
  const ix=index(), out=[];
  S.chapters.forEach((c,ci)=>{
    const d=ix.ch[c.id]; if(!d) return;
    const pm={}; d.marks.forEach(m=>(pm[m.para]=pm[m.para]||[]).push(m));
    Object.keys(pm).forEach(pi=>{
      const chars=pm[pi].filter(m=>m.tk==="char"), sks=pm[pi].filter(m=>m.tk==="skill");
      sks.forEach(sm=>{
        const s=byId(S.ent.skill,sm.id); if(!s) return;
        const own=((s.r||{}).owner||[]);
        if(own.length){ if(chars.length&&!chars.some(x=>own.includes(x.id)))
          out.push("Chương "+(ci+1)+" · đoạn "+(+pi+1)+": skill độc quyền “"+s.name+"” xuất hiện nhưng chủ nhân không có mặt."); }
        else if(chars.length===1){
          const c2=byId(S.ent.char,chars[0].id);
          if(c2&&!(((c2.r||{}).skill)||[]).includes(s.id))
            out.push("Chương "+(ci+1)+" · đoạn "+(+pi+1)+": “"+c2.name+"” đi cùng skill “"+s.name+"” nhưng skill chưa có trong hồ sơ nhân vật.");
        }
      });
      chars.forEach(cm=>{ const c2=byId(S.ent.char,cm.id);
        const dc=c2&&(c2.f||{}).deathCh;
        if(dc&&ci+1>+dc) out.push("Chương "+(ci+1)+": “"+c2.name+"” đã qua đời ở chương "+dc+" nhưng vẫn xuất hiện.");
      });
    });
  });
  allOf("char").forEach(c=>{ if(!(c.els||[]).length) out.push("“"+(c.name||"(chưa đặt tên)")+"” chưa được gán hệ."); });
  const u=[...new Set(out)].slice(0,60);
  el("chk").innerHTML=u.length?'<div style="margin-top:11px">'+u.map(w=>'<div class="warn">'+esc(w)+'</div>').join("")+'</div>'
    :'<p class="tiny" style="margin-top:11px;color:var(--ok)">Không tìm thấy mâu thuẫn nào.</p>';
}

/* ============ DÒ TÊN LẠ ============ */
const STOP=new Set(("nhưng và khi nàng chàng hắn anh chị cô cậu tôi ta một hai ba sau trước trong ngoài cả không nếu vì rồi lúc ngay thế mà bởi dù dưới trên đó này kia người có là những các với từ đến cho về như nó họ mình chúng bên giữa phía mọi mỗi tất vẫn đã sẽ đang chỉ còn lại thì được bị cùng hay hoặc tuy song vậy nên do tại bằng qua theo suốt khắp nữa chưa rất quá hơn nhất ai gì sao đâu nào bao cứ thôi đi ông bà em con cha mẹ thầy trò vua ngài chúng_ta giờ hôm nay mai đêm ngày sáng chiều tối năm tháng tuần phải nhìn nghe nói hỏi đáp làm thấy biết muốn cần xin vâng dạ ừ ờ à ồ ơ này ấy trời đất lần chuyện việc điều thứ cái con chiếc nơi chỗ khi_đó bấy_giờ sau_đó cuối_cùng thực_ra tất_cả bỗng chợt liền vụt khẽ chậm nhanh mạnh yếu").split(" "));
const isUp=c=>!!c&&c!==c.toLowerCase()&&c===c.toUpperCase();
function knownNames(){
  const s=new Set();
  allTypes().forEach(t=>(S.ent[t.k]||[]).forEach(e=>{
    [e.name,...String(e.aliases||"").split(",")].forEach(n=>{ n=n.trim().toLowerCase(); if(n) s.add(n); });
  }));
  return s;
}
function candidates(){
  if(scanCache) return scanCache;
  const known=knownNames(), ign=new Set((S.ignore||[]).map(x=>x.toLowerCase())), m={};
  S.chapters.forEach((c,ci)=>{
    (c.content||"").split(/\n+/).forEach((para,pi)=>{
      para.split(/(?<=[.!?…:;])\s+/).forEach(sent=>{
        const toks=sent.trim().split(/\s+/);
        let i=0;
        while(i<toks.length){
          const raw=toks[i], w=raw.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,"");
          if(w&&isUp(w[0])){
            const run=[w]; let j=i+1;
            while(j<toks.length&&run.length<4){
              const nx=toks[j].replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,"");
              if(nx&&isUp(nx[0])){ run.push(nx); j++; } else break;
            }
            const txt=run.join(" "), key=txt.toLowerCase();
            const head=(i===0);
            if(!known.has(key)&&!ign.has(key)&&!(run.length===1&&STOP.has(key))&&txt.length>1){
              const o=m[key]=m[key]||{txt,n:0,mid:0,ex:"",ci,pi};
              o.n++; if(!head) o.mid++;
              if(!o.ex) o.ex=sent.trim().slice(0,120);
            }
            i=j;
          } else i++;
        }
      });
    });
  });
  const out=Object.values(m).filter(o=>o.mid>0||o.n>=3)
    .sort((a,b)=>(b.mid-a.mid)||(b.n-a.n)).slice(0,100);
  scanCache=out; return out;
}

  if(!S.chapters.length) return '<div class="panel"><div class="empty">Chưa có chương nào để dò. Viết vài chương trước đã.</div></div>';
  const C=candidates();
  const opts=allTypes().map(t=>'<option value="'+t.k+'">'+esc(t.l)+'</option>').join("");
  const rows=C.map((o,i)=>'<div class="panel pad" style="margin-bottom:9px;box-shadow:none">'
    +'<div class="row" style="justify-content:space-between;align-items:flex-start">'

    +'<div class="row"><select class="inp" id="sc_'+i+'" style="width:auto;padding:5px 8px;font-size:12.5px">'+opts+'</select>'
    +'<button class="btn sm" onclick="A.scMake('+i+')">Tạo</button>'

    +'<div class="tiny" style="font-family:Spectral,serif;color:var(--muted);margin-top:6px">…'+esc(o.ex)+'…</div></div>').join("");
  const ig=(S.ignore||[]);
  return '<div class="pagehead"><div><h1>Dò tên lạ</h1><p>Những cái tên xuất hiện trong truyện nhưng chưa có hồ sơ</p></div>'

   +(C.length?rows:'<div class="panel"><div class="empty">Không còn tên lạ nào. Mọi cái tên trong truyện đều đã có hồ sơ hoặc đã bị bỏ qua.</div></div>')
   +(ig.length?'<div class="panel pad"><h3 class="sec">Đã bỏ qua ('+ig.length+')</h3><div class="chips">'
     +ig.map((x,i)=>'<button class="chip" onclick="A.scUnign('+i+')">'+esc(x)+' ×</button>').join("")
     +'</div><p class="tiny muted" style="margin:7px 0 0">Bấm để đưa trở lại danh sách dò.</p></div>':'')
   +'</div>';
}

const A={
  tab(k){ S.ui.tab=k; save(); render(); },
  pick(k,id){ sel[k]=id; render(); },
  go(k,id){ A.close(); sel[k]=id; S.ui.tab=k; save(); render(); },
  close(){ el("mroot").innerHTML=""; },
  theme(){ const c=document.documentElement.getAttribute("data-theme");
    const n=c==="dark"?"light":"dark"; document.documentElement.setAttribute("data-theme",n);
    try{ localStorage.setItem(KEY+"_th",n); }catch(e){} },
  filt(id,q){ const b=el(id); if(!b) return; q=q.toLowerCase();
    [...b.children].forEach(n=>{ const d=n.getAttribute("data-n")||n.textContent.toLowerCase(); n.style.display=d.includes(q)?"":"none"; }); },
  undo(){ if(!undoStack.length) return toast("Không còn gì để hoàn tác");
    try{ S=JSON.parse(undoStack.pop()); dirty=true; save(true); render(); toast("Đã hoàn tác"); }catch(e){} },

  /* thế giới */
  w(k,v){ S.world[k]=v; save(); if(k==="tagline") el("wtag").textContent=v; },
  ranks(v){ S.world.ranks=v.split(",").map(s=>s.trim()).filter(Boolean); save(); },
  addEl(){ snap(); S.elements.push({id:uid(),name:"Hệ mới",icon:"✦",color:"#7b7288",desc:""}); save(true); render(); },
  setEl(id,k,v){ const e=byId(S.elements,id); if(!e) return; e[k]=v; save(); },
  delEl(id){ if(!confirm("Xóa hệ này?")) return; snap();
    S.elements=S.elements.filter(e=>e.id!==id);
    S.counters=S.counters.filter(c=>c[0]!==id&&c[1]!==id);
    allTypes().forEach(t=>(S.ent[t.k]||[]).forEach(e=>{ if(e.els) e.els=e.els.filter(x=>x!==id); }));
    save(true); render(); },
  ctr(a,b){ snap(); const i=S.counters.findIndex(c=>c[0]===a&&c[1]===b);
    if(i>=0) S.counters.splice(i,1); else S.counters.push([a,b]); save(true); render(); },

  /* loại mục chung */
  add(k){ const T=tdef(k); snap();
    const e={id:uid(),eraId:S.eraId,name:T.l+" mới",icon:T.ic,aliases:"",els:[],f:{},r:{}};
    if(k==="char"){ e.aff={}; e.rel=[]; }
    S.ent[k].push(e); sel[k]=e.id; save(true); render(); },
  set(k,f,v){ const e=byId(S.ent[k],sel[k]); if(!e) return; e[f]=v; save();
    if(f==="name"){ const n=el("hNm"); if(n) n.textContent=v||"(chưa đặt tên)"; }
    if(f==="icon"){ const n=el("hIc"); if(n&&!(e.f||{}).img) n.textContent=v; }
    if(f==="eraId") setTimeout(render,400); },
  setf(k,f,v){ const e=byId(S.ent[k],sel[k]); if(!e) return; e.f=e.f||{}; e.f[f]=v; save(); },
  del(k,id){ if(!confirm("Xóa mục này?")) return; snap();
    S.ent[k]=S.ent[k].filter(e=>e.id!==id);
    allTypes().forEach(t=>(S.ent[t.k]||[]).forEach(e=>{ if(e.r) Object.keys(e.r).forEach(rk=>e.r[rk]=e.r[rk].filter(x=>x!==id)); }));
    sel[k]=null; save(true); render(); },
  tEl(k,eid){ const e=byId(S.ent[k],sel[k]); if(!e) return; snap();
    e.els=e.els||[]; const i=e.els.indexOf(eid);
    if(i>=0) e.els.splice(i,1); else e.els.push(eid); save(true); render(); },
  aff(eid,v){ const e=byId(S.ent.char,sel.char); if(!e) return; e.aff=e.aff||{}; e.aff[eid]=+v; save();
    const l=el("af_"+eid); if(l) l.textContent=v+"%"; },
  refPick(k,rk,to){
    const e=byId(S.ent[k],sel[k]); if(!e) return;
    const pool=to==="element"?S.elements:(S.ent[to]||[]);
    const cur=(e.r||{})[rk]||[];

     +'<div id="pk" style="max-height:54vh;overflow:auto">'+pool.map(p=>
       '<label class="item" data-n="'+esc(p.name.toLowerCase())+'" style="cursor:pointer"><input type="checkbox" '+(cur.includes(p.id)?"checked":"")+
       ' onchange="A.refSet(\''+k+'\',\''+rk+'\',\''+p.id+'\',this.checked)"><span class="nm">'+esc(p.name)+'</span></label>').join("")+'</div>',
     '<button class="btn" onclick="A.close();A.rr()">Xong</button>');
  },
  refSet(k,rk,id,on){ const e=byId(S.ent[k],sel[k]); if(!e) return; e.r=e.r||{}; e.r[rk]=e.r[rk]||[];
    if(on){ if(!e.r[rk].includes(id)) e.r[rk].push(id); } else e.r[rk]=e.r[rk].filter(x=>x!==id);
    save(); },
  rr(){ render(); },
  relAdd(cid){
    const others=allOf("char").filter(c=>c.id!==cid);
    if(!others.length) return toast("Cần ít nhất hai nhân vật.");

     +'<div class="field"><label>Ghi chú</label><input id="r_n" class="inp" placeholder="vd: anh trai cùng cha khác mẹ"></div>',
     '<button class="btn" onclick="A.relSave(\''+cid+'\')">Thêm</button>');
  },
  relSave(cid){ const c=byId(S.ent.char,cid); if(!c) return; snap(); c.rel=c.rel||[];
    c.rel.push({to:el("r_to").value,kind:el("r_k").value,note:el("r_n").value});
    A.close(); save(true); render(); },
  relDel(i){ const c=byId(S.ent.char,sel.char); if(!c) return; snap(); c.rel.splice(i,1); save(true); render(); },

  /* thư viện skill */
  fol(f){ skf.folder=f; render(); },
  skq(v){ skf.q=v; render(); const i=document.querySelector('.inp[placeholder^="Tìm tên"]'); if(i){ i.focus(); i.setSelectionRange(v.length,v.length); } },
  skt(v){ skf.type=v; render(); },
  libOpen(i){ const s=SKILL_SEED[i];
    modal(s[0],'<div class="chips" style="margin-bottom:10px"><span class="chip st">'+esc(s[2])+'</span><span class="chip st">'+esc(s[3])+'</span>'
     +'<span class="chip st">'+esc(s[4])+'</span>'+(s[6]?'<span class="chip st">'+esc(s[6])+'</span>':'')+'</div>'
     +'<p>'+esc(s[5])+'</p><p class="tiny muted">Thư mục: '+esc(s[1])+'</p>'
     +'<p class="tiny muted">Đưa vào truyện sẽ tạo một bản sao sửa được, và từ đó tên skill sẽ được dò tự động trong các chương.</p>',
     '<button class="btn" onclick="A.libAdd('+i+')">Đưa vào truyện</button>'); },
  libAdd(i){ const s=SKILL_SEED[i]; snap();
    const e={id:uid(),eraId:null,name:s[0],icon:"✦",aliases:"",els:[],
      f:{type:s[2],range:s[3],mech:s[4],desc:s[5],src:s[6],folder:s[1],rank:"C"},r:{}};
    S.ent.skill.push(e); A.close(); save(true); sel.skill=e.id; S.ui.tab="skill"; render(); toast("Đã thêm vào truyện"); },

  /* hợp thành */
  fpick(i){ const pool=allOf("skill");
    if(!pool.length) return toast("Chưa có skill nào trong truyện. Vào Thư viện skill mẫu để lấy trước.");
    modal("Chọn skill",'<input class="inp" placeholder="Tìm…" style="margin-bottom:9px" oninput="A.filt(\'fp\',this.value)">'
     +'<div id="fp" style="max-height:56vh;overflow:auto">'+pool.map(s=>'<button class="item" data-n="'+esc(s.name.toLowerCase())+'" onclick="A.fset('+i+',\''+s.id+'\')">'
      +'<span class="ava">✦</span><span><span class="nm">'+esc(s.name)+'</span><br><span class="mt">'+esc((s.f||{}).type||"")+' · bậc '+esc((s.f||{}).rank||"—")+'</span></span></button>').join("")+'</div>'); },
  fset(i,id){ fuse[i]=id; A.close(); render(); },
  fsave(){ const a=skillOf(fuse[0]),b=skillOf(fuse[1]); if(!a||!b) return; snap();
    const r=mix(a,b);
    const e={id:uid(),eraId:null,name:r.name,icon:"✦",aliases:"",els:r.els,
      f:{type:r.type,range:r.range,rank:r.rank,mech:r.mech,desc:r.desc,folder:"Hợp thành",src:"hợp thành"},r:{},recipe:r.recipe};
    S.ent.skill.push(e); save(true); sel.skill=e.id; S.ui.tab="skill"; render(); toast("Đã tạo skill mới"); },

  /* truyện */
  addCh(){ snap(); const c={id:uid(),title:"Chương "+(S.chapters.length+1),content:"",status:"nháp"};
    S.chapters.push(c); sel.chapter=c.id; save(true); render(); },
  setCh(k,v){ const c=byId(S.chapters,sel.chapter); if(!c) return; c[k]=v; save(); },
  delCh(){ if(!confirm("Xóa chương này?")) return; snap();
    S.chapters=S.chapters.filter(c=>c.id!==sel.chapter); sel.chapter=null; save(true); render(); },
  mvCh(d){ const i=S.chapters.findIndex(c=>c.id===sel.chapter), j=i+d;
    if(i<0||j<0||j>=S.chapters.length) return; snap();
    const [x]=S.chapters.splice(i,1); S.chapters.splice(j,0,x); save(true); render(); },
  rd(id){ sel.read=id; render(); },
  jump(cid,para){ A.close(); sel.read=cid; S.ui.tab="read"; save(); render();
    setTimeout(()=>{ const p=el("p_"+para); if(p){ p.scrollIntoView({block:"center",behavior:"smooth"});
      p.style.background="var(--accent-soft)"; setTimeout(()=>p.style.background="",2200); } },90); },
  check,
  peek(tk,id){ const T=tdef(tk), e=byId(S.ent[tk],id); if(!e) return;
    const fs=(T.f||[]).filter(f=>(e.f||{})[f.k]).slice(0,6);
    modal(e.name,'<p class="tiny muted" style="margin:0 0 8px">'+esc(T.l)+'</p>'
     +(e.els||[]).map(x=>'<span class="chip st" style="background:'+elc(x)+';color:#fff;border-color:transparent">'+esc(eln(x))+'</span>').join(" ")
     +'<div style="margin-top:10px">'+fs.map(f=>'<div class="tiny" style="margin-bottom:4px"><span class="muted">'+esc(f.l)+':</span> '+esc(String((e.f||{})[f.k]).slice(0,220))+'</div>').join("")+'</div>',
     '<button class="btn" onclick="A.go(\''+tk+'\',\''+id+'\')">Mở hồ sơ đầy đủ</button>'); },

  /* thời đại */
  setEra(id){ S.eraId=id; save(); render(); },
  eras(){ modal("Thời đại",
    S.eras.map((e,i)=>'<div class="row" style="margin-bottom:6px"><input class="inp" value="'+esc(e.name)+'" oninput="A.eraName('+i+',this.value)">'
     +(S.eras.length>1?'<button class="btn danger sm" onclick="A.eraDel(\''+e.id+'\')">Xóa</button>':'')+'</div>').join("")
    +'<p class="tiny muted">Mỗi mục có thể thuộc một thời đại, hoặc để “Xuyên suốt” nếu tồn tại qua mọi thời kỳ.</p>',
    '<button class="btn" onclick="A.eraAdd()">Thêm thời đại</button>'); },
  eraName(i,v){ S.eras[i].name=v; save(); el("eraSel").options[i].textContent=v; },
  eraAdd(){ snap(); const e={id:uid(),name:"Thời đại mới",note:""}; S.eras.push(e); save(true); A.close(); render(); },
  eraDel(id){ if(S.eras.length<2) return; if(!confirm("Xóa thời đại này? Các mục thuộc nó sẽ thành xuyên suốt.")) return;
    snap(); S.eras=S.eras.filter(e=>e.id!==id);
    allTypes().forEach(t=>(S.ent[t.k]||[]).forEach(e=>{ if(e.eraId===id) e.eraId=null; }));
    if(S.eraId===id) S.eraId=S.eras[0].id; save(true); A.close(); render(); },

  /* loại mục tự tạo */
  mkType(){
    const l=el("ct_l").value.trim(); if(!l) return toast("Chưa nhập tên loại mục");
    const mk=(s,t)=>s.split(",").map(x=>x.trim()).filter(Boolean).map(x=>({k:"c"+uid(),l:x,t}));
    const T={k:"cu"+uid(),l,ic:el("ct_i").value||"✧",g:"Khác",els:el("ct_e").checked?1:0,
      f:mk(el("ct_f").value,"text").concat(mk(el("ct_a").value,"area")),r:[]};
    snap(); S.custom.push(T); S.ent[T.k]=[]; save(true); S.ui.tab=T.k; render(); toast("Đã tạo loại mục "+l); },
  delType(k){ if(!confirm("Xóa loại mục này và toàn bộ dữ liệu trong đó?")) return; snap();
    S.custom=S.custom.filter(t=>t.k!==k); delete S.ent[k]; save(true); S.ui.tab="custom"; render(); },

  /* tìm kiếm */
  search(){
    modal("Tìm toàn bộ",'<input id="sq" class="inp" placeholder="Gõ để tìm nhân vật, skill, địa danh, chương…" oninput="A.doSearch(this.value)">'
      +'<div id="sr" style="max-height:56vh;overflow:auto;margin-top:10px"></div>',"",true);
    setTimeout(()=>{ const i=el("sq"); if(i) i.focus(); },50); },
  doSearch(q){
    q=q.trim().toLowerCase(); const r=el("sr"); if(!r) return;
    if(q.length<2){ r.innerHTML='<p class="tiny muted">Gõ ít nhất 2 ký tự.</p>'; return; }
    let out="";
    allTypes().forEach(t=>{
      (S.ent[t.k]||[]).filter(e=>(e.name+" "+(e.aliases||"")+" "+JSON.stringify(e.f||{})).toLowerCase().includes(q)).slice(0,6).forEach(e=>{
        out+='<button class="item" onclick="A.go(\''+t.k+'\',\''+e.id+'\')"><span class="ava">'+esc(e.icon||t.ic)+'</span>'
          +'<span><span class="nm">'+esc(e.name)+'</span><br><span class="mt">'+esc(t.l)+'</span></span></button>';
      });
    });
    S.chapters.filter(c=>((c.title||"")+" "+(c.content||"")).toLowerCase().includes(q)).slice(0,6).forEach((c,i)=>{
      out+='<button class="item" onclick="A.jump(\''+c.id+'\',0)"><span class="ava">📖</span><span><span class="nm">'+esc(c.title||"Chương")+'</span><br><span class="mt">chương truyện</span></span></button>';
    });
    const lib=SKILL_SEED.map((s,i)=>[s,i]).filter(([s])=>s[0].toLowerCase().includes(q)).slice(0,5);
    lib.forEach(([s,i])=>{ out+='<button class="item" onclick="A.close();A.tab(\'lib\');A.libOpen('+i+')"><span class="ava">✦</span>'
      +'<span><span class="nm">'+esc(s[0])+'</span><br><span class="mt">thư viện mẫu · '+esc(s[1])+'</span></span></button>'; });
    r.innerHTML=out||'<p class="tiny muted">Không tìm thấy gì.</p>';
  },

  /* dò tên lạ */
  scRefresh(){ scanCache=null; render(); toast("Đã dò lại"); },
  skm(v){ skf.mech=v; render(); },
  shuf(){ skf.rnd=!skf.rnd; render(); },
  scMake(i){
    const o=candidates()[i]; if(!o) return;
    const tk=el("sc_"+i).value, T=tdef(tk); if(!T) return;
    snap();
    const e={id:uid(),eraId:S.eraId,name:o.txt,icon:T.ic,aliases:"",els:[],f:{},r:{}};
    if(tk==="char"){ e.aff={}; e.rel=[]; }
    S.ent[tk].push(e); sel[tk]=e.id; scanCache=null; save(true);
    S.ui.tab=tk; render(); toast("Đã tạo "+T.l.toLowerCase()+" “"+o.txt+"”");
  },
  scAlias(i){
    const o=candidates()[i]; if(!o) return;
    let rows="";
    allTypes().forEach(t=>(S.ent[t.k]||[]).forEach(e=>{
      rows+='<button class="item" data-n="'+esc(e.name.toLowerCase())+'" onclick="A.scAliasSet('+i+',\''+t.k+'\',\''+e.id+'\')">'
        +'<span class="ava">'+esc(e.icon||t.ic)+'</span><span><span class="nm">'+esc(e.name)+'</span><br><span class="mt">'+esc(t.l)+'</span></span></button>';
    }));
    if(!rows) return toast("Chưa có mục nào để gộp vào.");
    modal("Gộp “"+o.txt+"” làm biệt danh của",
      '<input class="inp" placeholder="Tìm…" style="margin-bottom:9px" oninput="A.filt(\'ga\',this.value)">'
      +'<div id="ga" style="max-height:54vh;overflow:auto">'+rows+'</div>');
  },
  scAliasSet(i,tk,id){
    const o=candidates()[i], e=byId(S.ent[tk],id); if(!o||!e) return;
    snap();
    const cur=String(e.aliases||"").split(",").map(x=>x.trim()).filter(Boolean);
    if(!cur.some(x=>x.toLowerCase()===o.txt.toLowerCase())) cur.push(o.txt);
    e.aliases=cur.join(", "); scanCache=null; save(true); A.close(); render();
    toast("“"+o.txt+"” giờ là biệt danh của "+e.name);
  },
  scIgn(i){ const o=candidates()[i]; if(!o) return; snap();
    S.ignore=S.ignore||[]; S.ignore.push(o.txt); scanCache=null; save(true); render(); },
  scUnign(i){ snap(); S.ignore.splice(i,1); scanCache=null; save(true); render(); },

  /* dữ liệu */
  data(){
    const j=JSON.stringify(S);
    modal("Dữ liệu",'<p class="tiny muted">Đang lưu trong trình duyệt máy này ('+(new Blob([j]).size/1024).toFixed(1)+' KB). Xuất ra file để giữ bản sao và để đổ sang hệ thống lưu trữ chính thức sau này.</p>'
     +'<div class="row" style="margin:11px 0"><button class="btn" onclick="A.exp()">Tải file .json</button>'
     +'<label class="btn ghost" style="cursor:pointer">Nạp file .json<input type="file" accept="application/json" style="display:none" onchange="A.imp(this)"></label>'
     +'<button class="btn danger sm" onclick="A.reset()">Xóa sạch làm lại</button></div>'
     +'<div class="field"><label>Hoặc copy thủ công</label><textarea class="inp" readonly style="min-height:130px;font-family:ui-monospace,monospace;font-size:11px">'+esc(JSON.stringify(S,null,1))+'</textarea></div>'); },
  async exp(){
    const j=JSON.stringify(S,null,1);
    let dl=null; try{ dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null; }catch(e){}
    if(dl){ try{ await dl.save({filename:(S.world.name||"codex").replace(/[^\p{L}\p{N}]+/gu,"-")+".json",data:j}); toast("Đã xuất file"); }
      catch(e){ toast("Không tải được, hãy copy ở ô bên dưới"); } }
    else toast("Hãy copy ở ô bên dưới"); },
  imp(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.elements||!d.ent) throw 0;
      snap(); S=d; S.custom=S.custom||[]; allTypes().forEach(t=>{ if(!S.ent[t.k]) S.ent[t.k]=[]; });
      sel={}; dirty=true; save(true); A.close(); render(); toast("Đã nạp dữ liệu");
    }catch(e){ toast("File không đúng định dạng"); } };
    r.readAsText(f); },
  reset(){ if(!confirm("Xóa toàn bộ và bắt đầu lại?")) return; snap(); S=seed(); sel={}; save(true); A.close(); render(); }
};
window.A=A;

document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); A.search(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!/INPUT|TEXTAREA/.test((e.target||{}).tagName||"")){ e.preventDefault(); A.undo(); }
  if(e.key==="Escape") A.close();
});
try{ const th=localStorage.getItem(KEY+"_th"); if(th) document.documentElement.setAttribute("data-theme",th); }catch(e){}
render();
})();
</script>
</body>
</html>
